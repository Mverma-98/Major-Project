<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{

            background:
            linear-gradient(
                135deg,
                #141e30,
                #243b55
            );

            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .dashboard-container{

            width:90%;
            max-width:800px;

            background:
            rgba(255,255,255,0.1);

            backdrop-filter: blur(12px);

            border-radius:20px;

            padding:40px;

            box-shadow:
            0 8px 32px rgba(
                0,
                0,
                0,
                0.3
            );

            text-align:center;

            color:white;
        }

        h1{

            margin-bottom:20px;
            font-size:36px;
        }

        #role{

            font-size:20px;
            margin-bottom:30px;
            color:#ffd369;
        }

        .button-group{

            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
        }

        button{

            border:none;

            padding:14px 24px;

            border-radius:12px;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;
        }

        .get-btn{

            background:#00c853;
            color:white;
        }

        .post-btn{

            background:#2962ff;
            color:white;
        }

        .delete-btn{

            background:#d50000;
            color:white;
        }

        button:hover{

            transform:translateY(-3px);
        }

        #result{

            margin-top:30px;

            background:
            rgba(
                255,
                255,
                255,
                0.15
            );

            padding:20px;

            border-radius:15px;

            text-align:left;

            overflow:auto;

            max-height:300px;

            color:#08a32a;
        }

        .logout-btn{

            margin-top:25px;

            background:#ff9800;

            color:white;
        }

    </style>
</head>

<body>

<div class="dashboard-container">

    <h1>
        API Access Management Dashboard
    </h1>

    <h3 id="role"></h3>

    <div class="button-group">

        <button
            class="get-btn"
            onclick="getData()">

            Get Data
        </button>

        <button
            class="post-btn"
            onclick="writeData()">

            Write Data
        </button>

        <button
            class="delete-btn"
            onclick="deleteData()">

            Delete Data
        </button>

    </div>

    <pre id="result">
API Response will appear here...
    </pre>

    <button
        class="logout-btn"
        onclick="logout()">

        Logout
    </button>

</div>

<script>

const token =
localStorage.getItem('token');

const role =
localStorage.getItem('role');

if(!token){

    window.location.href =
    'index.html';
}

document.getElementById(
'role'
).innerText =
'Logged in as: ' + role;

async function getData(){

    const response =
    await fetch('/api/data',{

        headers:{
            Authorization:
            'Bearer ' + token
        }
    });

    const data =
    await response.json();

    document.getElementById(
    'result'
    ).innerText =
    data.message || 'No message returned';
}

async function writeData(){

    const response =
    await fetch('/api/data',{

        method:'POST',

        headers:{
            Authorization:
            'Bearer ' + token
        }
    });

    const data =
    await response.json();

    document.getElementById(
    'result'
    ).innerText =
    data.message || 'No message returned';
}

async function deleteData(){

    const response =
    await fetch('/api/data',{

        method:'DELETE',

        headers:{
            Authorization:
            'Bearer ' + token
        }
    });

    const data =
    await response.json();

    document.getElementById(
    'result'
    ).innerText =
    data.message || 'No message returned';
}

function logout(){

    localStorage.clear();

    window.location.href =
    'index.html';
}

</script>

</body>
</html>
